name: CI

# Single workflow for build, security, docs, and repo automation.
# One push/PR = one workflow run (conditional jobs). Scorecard is weekly in release.yml
# (cannot share id-token with GitHub Pages deploy in the same workflow).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Fast debug APKs for device/Waydroid installs (parallel with full build) ──
  debug-apks:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Assemble debug APKs (arm64-v8a + x86_64)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./gradlew :app:assembleDebug -Ponionphone.devAbi=arm64-v8a --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/*-debug.apk artifacts/app-debug-arm64-v8a.apk
          ./gradlew :app:assembleDebug -Ponionphone.devAbi=x86_64 --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/*-debug.apk artifacts/app-debug-x86_64.apk

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── Tests + CodeQL (push, PR, manual) ─────────────────────────────
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      # Hard wall so hung HttpServer / Robolectric cannot stall forever.
      # Exit 124 = wall timeout; accept if JUnit XML shows zero failures (Gradle
      # often hangs on JVM shutdown after green tests).
      - name: Unit tests
        timeout-minutes: 25
        run: |
          set +e
          timeout 12m ./gradlew test --stacktrace --no-daemon --console=plain
          code=$?
          ./gradlew --stop || true
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -eq 124 ]; then
            mapfile -t reports < <(find . -path '*/build/test-results/*/*.xml' -type f 2>/dev/null)
            if [ "${#reports[@]}" -eq 0 ]; then
              echo "Timed out with no test reports"
              exit 124
            fi
            if grep -E 'failures="[1-9]|errors="[1-9]' "${reports[@]}" >/dev/null 2>&1; then
              echo "Timed out with failing tests"
              exit 1
            fi
            echo "Unit tests green in reports; Gradle hung on shutdown (timeout 124) — accepting"
            exit 0
          fi
          exit "$code"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        run: |
          ./gradlew --stop || true
          ./gradlew clean :app:assembleDebug -Ponionphone.devAbi=arm64-v8a \
            --no-daemon --no-build-cache --rerun-tasks

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  # ── OWASP dependency diff (PR only) ───────────────────────────────
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  # ── KDoc → GitHub Pages (main push / manual) ──────────────────────
  docs:
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Generate KDoc (Dokka HTML)
        run: ./gradlew dokkaGenerate --stacktrace --no-daemon

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Repo automation (event-gated, no extra workflow files) ──────────
  labeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  greetings:
    if: >
      github.event.action == 'opened' &&
      (github.event_name == 'issues' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening an issue on **PGP Shield**!

            - Check [docs/ARCHITECTURE.md](https://github.com/LTechnologies0/pgp-shield/blob/main/docs/ARCHITECTURE.md)
            - For security issues, use **private vulnerability reporting** (see SECURITY.md)
          pr-message: |
            Thanks for your pull request! CI runs tests, debug APK build, and CodeQL.
            Please add KDoc for new public APIs and ensure no secrets are committed.

  auto-assign:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: pozil/auto-assign-issue@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: LTechnologies0

  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Label Dependabot issues
        if: contains(github.event.issue.user.login, 'dependabot')
        run: gh issue edit "${{ github.event.issue.number }}" --add-label dependencies

      - name: Label security issues
        if: >
          contains(github.event.issue.title, 'security') ||
          contains(github.event.issue.title, 'vulnerability') ||
          contains(github.event.issue.title, 'CVE')
        run: gh issue edit "${{ github.event.issue.number }}" --add-label security

  stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,enhancement,bug
          exempt-pr-labels: security,dependencies
          operations-per-run: 50

  release-drafter:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
